<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Finanças Fácil</title><style>
  :root {
    --bg: #FAF6EF;
    --surface: #FFFFFF;
    --text: #1C2530;
    --text-secondary: #5B6773;
    --primary: #14293D;
    --accent: #B08D57;
    --border: #E4DECF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 24px 96px;
  }
  header {
    border-bottom: 2px solid var(--accent);
    padding-bottom: 24px;
    margin-bottom: 32px;
  }
  h1 {
    font-size: 1.9rem;
    color: var(--primary);
    margin: 0 0 8px;
  }
  .subtitle {
    color: var(--text-secondary);
    font-size: 0.95rem;
  }
  .draft-notice {
    background: #FFF7E8;
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 32px;
    font-size: 0.92rem;
    color: var(--text);
  }
  .draft-notice strong { color: var(--primary); }
  h2 {
    font-size: 1.25rem;
    color: var(--primary);
    margin-top: 40px;
    border-left: 4px solid var(--accent);
    padding-left: 12px;
  }
  h3 {
    font-size: 1.05rem;
    color: var(--primary);
    margin-top: 24px;
  }
  p, li { color: var(--text); }
  ul { padding-left: 22px; }
  li { margin-bottom: 6px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    margin: 16px 0;
  }
  .placeholder {
    background: #FFF3F3;
    color: #8C3A3A;
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 600;
  }
  footer {
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 0.85rem;
  }
  a { color: var(--primary); }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1620; --surface: #16212D; --text: #E8E3D9; --text-secondary: #A3ADB8;
      --primary: #E8E3D9; --accent: #C9A46A; --border: #2A3644;
    }
  }
  .meta { color: var(--text-secondary); font-size: 0.9rem; }
  .highlight { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 8px; padding: 16px 20px; }
  footer { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--border); color: var(--text-secondary); font-size: 0.9rem; }
</style></head>
